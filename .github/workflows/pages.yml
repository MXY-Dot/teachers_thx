# Деплой открытки на GitHub Pages при каждом пуше в main.
# Сайт: https://mxy-dot.github.io/teachers_thx/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and minify site files
        run: |
          mkdir -p public
          cp -r fonts og.jpg apple-touch-icon.png public/
          # HTML/CSS/JS без пробелов и комментариев — меньше байт на медленном интернете
          npx -y html-minifier-terser@7 --collapse-whitespace --conservative-collapse \
            --remove-comments --minify-css true --minify-js true -o public/index.html index.html
          # новая версия офлайн-кеша на каждый деплой
          sed "s/__VERSION__/${GITHUB_SHA::8}/" sw.js > public/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
